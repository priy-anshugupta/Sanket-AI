version: '3.8'

services:
  # ─── SANKET · AI Backend (FastAPI + AI Pipeline) ───
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: sanket-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - AI_MODE=online
      - DATABASE_URL=sqlite+aiosqlite:///./data/sanket.db
      - JWT_SECRET=sanket-ai-sih26165-secret-key-2026
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GROQ_MODEL=llama-3.3-70b-versatile
      - OLLAMA_HOST=http://ollama:11434
      - OLLAMA_MODEL=llama3.1:8b
      - SIF_HIGH_THRESHOLD=0.75
      - SIF_MEDIUM_THRESHOLD=0.50
      - LSR_SIMILARITY_THRESHOLD=0.45
      - CLUSTER_WINDOW_DAYS=7
      - CLUSTER_MIN_EVENTS=3
      - EMBEDDING_MODEL=intfloat/multilingual-e5-small
    volumes:
      - sanket_db:/app/data
      - sanket_pdfs:/app/generated_pdfs
    networks:
      - sanket-net

  # ─── SANKET · AI Frontend (Next.js Command Center) ───
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: sanket-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend
    networks:
      - sanket-net

  # ─── (Optional) Local Ollama for Sovereign Air-Gap LLM ───
  ollama:
    image: ollama/ollama:latest
    container_name: sanket-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - sanket-net

volumes:
  sanket_db:
    driver: local
  sanket_pdfs:
    driver: local
  ollama_data:
    driver: local

networks:
  sanket-net:
    driver: bridge
